<!DOCTYPE html>
<html lang="ja" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>JOYFIT24経堂 | 東京農業大学ラグビー部様 特別割引</title>
    <meta name="description" content="JOYFIT24経堂｜東京農業大学ラグビー部様 特別割引お申込">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans JP', sans-serif;
            color: #F3F4F6;
            background-image:
                linear-gradient(rgba(17, 24, 39, 0.88), rgba(17, 24, 39, 0.92)),
                url('https://images.unsplash.com/photo-1571902943202-507ec2618e8f?q=80&w=1975&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
        }
        :root {
            --brand-red: #D90429;
            --brand-red-dark: #B30021;
        }
        .text-brand-red { color: var(--brand-red); }
        .bg-brand-red { background-color: var(--brand-red); }
        .hover\:bg-brand-red-dark:hover { background-color: var(--brand-red-dark); }
        .border-brand-red { border-color: var(--brand-red); }
        .lp-card {
            background-color: #FFFFFF;
            border: 4px solid transparent;
            background-image: linear-gradient(#fff, #fff), linear-gradient(135deg, #ff8a9e 0%, #D90429 50%, #8a001a 100%);
            background-origin: border-box;
            background-clip: padding-box, border-box;
            border-radius: 1.5rem;
            color: #1F2937;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5), 0 4px 6px -2px rgba(0, 0, 0, 0.3);
        }
        .cta-button {
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        .cta-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(217, 4, 41, 0.25), 0 4px 6px -2px rgba(217, 4, 41, 0.15);
        }
        .minimal-input {
            border: none;
            border-bottom: 1px solid #D1D5DB;
            border-radius: 0;
            padding: 0.75rem 0;
            background-color: transparent;
            transition: border-color 0.3s;
            color: #111827;
        }
        .minimal-input:focus {
            outline: none;
            border-bottom-color: var(--brand-red);
            box-shadow: none;
        }
        select.minimal-input {
            padding-right: 2rem;
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%236B7280' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
            background-position: right 0 center;
            background-repeat: no-repeat;
            background-size: 1.5em 1.5em;
            appearance: none;
        }
        .button-loading { opacity: 0.7; cursor: not-allowed; }
        .close-btn {
            position: absolute;
            top: -15px;
            right: -15px;
            width: 40px;
            height: 40px;
            background-color: var(--brand-red);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
            z-index: 60;
        }
        .close-btn:hover {
            transform: scale(1.1);
            background-color: #b91c1c;
        }
    </style>
</head>
<body class="antialiased">

    <header class="w-full">
        <div class="container mx-auto px-6 pt-12 pb-6 md:pt-16 text-center max-w-3xl">
            <p class="text-sm md:text-base font-bold text-gray-300 tracking-widest mb-3">東京農業大学 ラグビー部 部員様限定</p>
            <h1 class="text-3xl md:text-5xl font-black text-white leading-tight drop-shadow-lg">
                JOYFIT24 <span class="text-brand-red">経堂</span>
            </h1>
            <h2 class="mt-6 text-2xl md:text-4xl font-bold text-white drop-shadow-lg">
                特別割引 <span class="text-brand-red">お申込</span>
            </h2>
        </div>
    </header>

    <main class="pb-20 sm:pb-24 px-6">
        <div class="container mx-auto max-w-lg">
            <div class="lp-card p-8 md:p-10 relative">
                <div class="mb-8 rounded-lg border-2 border-brand-red bg-red-50 p-5 text-center text-sm text-gray-800 space-y-3 leading-relaxed">
                    <p class="font-bold text-gray-900">こちら専用ページ申請 ＋ JOYFITアプリから入会</p>
                    <p>割引適用は上記2点を完了していただく必要があります</p>
                    <p class="font-bold text-brand-red">【2点当月末日までに申請】</p>
                    <p>いずれか一方のみでは適用されません。</p>
                    <p class="pt-1">
                        JOYFITアプリは<a href="https://joyfit.jp/pr_app/" target="_blank" rel="noopener noreferrer" class="text-brand-red font-bold underline underline-offset-2 hover:opacity-80">コチラ</a>からDL
                    </p>
                </div>

                <form id="nodai-rugby-form" class="space-y-8" novalidate>
                    <input type="hidden" name="campaignType" value="ラグビー割">

                    <div>
                        <label for="name" class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">お名前（漢字）</label>
                        <input type="text" id="name" name="お名前" placeholder="例：山田 太郎" required autocomplete="name" class="minimal-input w-full text-lg placeholder-gray-300">
                    </div>

                    <div>
                        <label for="furigana" class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">フリガナ（カタカナ）</label>
                        <input type="text" id="furigana" name="フリガナ" placeholder="例：ヤマダ タロウ" required class="minimal-input w-full text-lg placeholder-gray-300">
                    </div>

                    <div>
                        <label for="grade" class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">現在の学年</label>
                        <select id="grade" name="学年" required class="minimal-input w-full text-lg bg-transparent">
                            <option value="" disabled selected class="text-gray-400">選択してください</option>
                            <option value="１年生">１年生</option>
                            <option value="２年生">２年生</option>
                            <option value="３年生">３年生</option>
                            <option value="４年生">４年生</option>
                            <option value="その他">その他</option>
                        </select>
                    </div>

                    <div>
                        <label for="grad-month" class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">卒業予定年月</label>
                        <input type="month" id="grad-month" name="卒業予定年月" required class="minimal-input w-full text-lg">
                    </div>

                    <div class="pt-2">
                        <button type="submit" class="cta-button w-full bg-brand-red text-white font-bold py-4 px-6 rounded-lg hover:bg-brand-red-dark text-base tracking-wide">
                            入力内容を送信する
                        </button>
                    </div>
                </form>
            </div>

            <p class="text-center mt-10">
                <a href="https://24kyodo-special-plan.vercel.app/" class="text-sm text-gray-400 hover:text-white underline underline-offset-2 transition-colors">
                    JOYFIT24経堂 キャンペーン一覧へ
                </a>
            </p>
        </div>
    </main>

    <footer class="bg-black/50 border-t border-gray-700 backdrop-blur-sm">
        <div class="container mx-auto px-6 py-8 text-center text-gray-500 text-xs space-y-4">
            <img src="joyfit_logo.png" alt="JOYFIT24" class="mx-auto h-12 w-auto">
            <p>&copy; JOYFIT24 Kyodo</p>
        </div>
    </footer>

    <div id="completion-modal" class="hidden fixed inset-0 bg-black bg-opacity-90 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="relative bg-white rounded-lg shadow-2xl w-full max-w-lg flex flex-col p-8 overflow-visible">
            <button type="button" id="modal-close-btn" class="close-btn" aria-label="閉じる">&times;</button>
            <div class="text-center">
                <h3 class="text-2xl font-black text-gray-900 mb-2">申請ありがとうございます</h3>
                <p class="text-sm text-gray-500 font-bold mb-6">申請を受け付けました</p>
                <div id="receipt-content" class="mb-8 text-left bg-gray-50 p-6 rounded border border-gray-100 space-y-3 text-sm text-gray-600"></div>
                <div class="bg-red-50 border-2 border-brand-red rounded-lg p-4 text-brand-red shadow-md animate-pulse">
                    <div class="flex items-center justify-center mb-1">
                        <svg class="w-6 h-6 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                        <span class="font-black text-lg">重要</span>
                    </div>
                    <p class="font-bold text-sm sm:text-base">この画面をスクリーンショットして<br>必ず保存してください</p>
                </div>
                <div class="mt-6">
                    <a href="https://joyfit.jp/kyodo/app_join/" target="_blank" rel="noopener noreferrer" class="text-xs text-gray-400 hover:text-brand-red underline transition-colors">
                        JOYFITアプリで入会手続きへ
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('nodai-rugby-form');
            const submitButton = form.querySelector('button[type="submit"]');
            const modal = document.getElementById('completion-modal');
            const modalCloseBtn = document.getElementById('modal-close-btn');
            const receiptContent = document.getElementById('receipt-content');

            const gasWebAppUrl = 'https://script.google.com/macros/s/AKfycbzmuAd-yGKOdoD49j3nPi4gjPPaq-0AFXK0faWLsoVLhRK1LLOBvZQBGdanqncljxdw8A/exec';

            function escapeHtml(s) {
                if (s == null || s === '') return '';
                return String(s)
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;');
            }

            form.addEventListener('submit', async (event) => {
                event.preventDefault();
                if (!form.checkValidity()) {
                    showNotification('必須項目を入力してください', 'error');
                    form.reportValidity();
                    return;
                }

                submitButton.disabled = true;
                submitButton.textContent = '送信中...';
                submitButton.classList.add('button-loading');

                const formData = new FormData(form);
                const payload = {};
                formData.forEach((value, key) => { payload[key] = value; });

                try {
                    await fetch(gasWebAppUrl, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify(payload)
                    });
                    showCompletionModal(payload);
                } catch (error) {
                    console.error(error);
                    showNotification('送信失敗。ネットワークを確認してください', 'error');
                } finally {
                    submitButton.disabled = false;
                    submitButton.textContent = '入力内容を送信する';
                    submitButton.classList.remove('button-loading');
                }
            });

            function showCompletionModal(data) {
                const t = new Date().toLocaleString('ja-JP');
                receiptContent.innerHTML = `
                    <div class="flex justify-between border-b border-gray-200 pb-2">
                        <span class="text-gray-400 font-medium">申請日時</span>
                        <span class="font-bold text-gray-800 font-mono">${escapeHtml(t)}</span>
                    </div>
                    <div class="flex justify-between border-b border-gray-200 pb-2">
                        <span class="text-gray-400 font-medium">キャンペーン</span>
                        <span class="font-bold text-gray-800">${escapeHtml(data['campaignType'])}</span>
                    </div>
                    <div class="flex justify-between border-b border-gray-200 pb-2">
                        <span class="text-gray-400 font-medium">お名前</span>
                        <span class="font-bold text-gray-800">${escapeHtml(data['お名前'])}</span>
                    </div>
                    <div class="flex justify-between border-b border-gray-200 pb-2">
                        <span class="text-gray-400 font-medium">フリガナ</span>
                        <span class="font-bold text-gray-800">${escapeHtml(data['フリガナ'])}</span>
                    </div>
                    <div class="flex justify-between border-b border-gray-200 pb-2">
                        <span class="text-gray-400 font-medium">学年</span>
                        <span class="font-bold text-gray-800">${escapeHtml(data['学年'])}</span>
                    </div>
                    <div class="flex justify-between border-b border-gray-200 pb-2">
                        <span class="text-gray-400 font-medium">卒業予定年月</span>
                        <span class="font-bold text-gray-800">${escapeHtml(data['卒業予定年月'])}</span>
                    </div>
                `;
                modal.classList.remove('hidden');
                document.body.style.overflow = 'hidden';
            }

            modalCloseBtn.addEventListener('click', () => {
                modal.classList.add('hidden');
                document.body.style.overflow = '';
                form.reset();
            });

            function showNotification(message, type = 'error') {
                const existing = document.querySelector('.form-notification');
                if (existing) existing.remove();
                const notification = document.createElement('div');
                notification.className = 'form-notification fixed bottom-5 right-5 px-6 py-3 rounded-sm text-white z-[60] transition-opacity duration-300 shadow-xl text-sm font-medium';
                notification.textContent = message;
                notification.style.backgroundColor = type === 'success' ? '#10B981' : '#1F2937';
                if (type === 'error') notification.style.borderLeft = '4px solid #D90429';
                document.body.appendChild(notification);
                setTimeout(() => { notification.style.opacity = '1'; }, 10);
                setTimeout(() => {
                    notification.style.opacity = '0';
                    setTimeout(() => notification.remove(), 300);
                }, 5000);
            }
        });
    </script>
</body>
</html>
